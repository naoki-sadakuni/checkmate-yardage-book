<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>チェックメイトカントリークラブ｜手作りヤーデージブック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F3ECD9;
    --paper-2:#EAE0C4;
    --card:#FBF7EC;
    --ink:#241F17;
    --ink-soft:#5A5142;
    --pine:#22331E;
    --fairway:#3E5D3B;
    --fairway-l:#E4EBDE;
    --brass:#B8924A;
    --brass-d:#8A6B33;
    --brass-l:#F2E6C9;
    --hazard:#35586B;
    --hazard-l:#DFEAF0;
    --line:#CFC3A0;
    --shadow:0 2px 10px rgba(36,31,23,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  .frame{
    display:flex;
    max-width:1180px;
    margin:0 auto;
    min-height:100vh;
  }
  /* ---- Header ---- */
  .top{
    padding:28px 32px 18px;
    border-bottom:1px solid var(--line);
  }
  .top-title{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:30px;
    color:var(--pine);
    letter-spacing:0.01em;
    margin:0;
  }
  .top-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin:4px 0 16px;
  }
  .stat-strip{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .stat{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 14px;
    min-width:82px;
  }
  .stat b{
    display:block;
    font-family:'IBM Plex Mono',monospace;
    font-size:16px;
    color:var(--pine);
  }
  .stat span{
    font-size:11px;
    color:var(--ink-soft);
  }
  .howto{
    margin-top:16px;
    background:var(--brass-l);
    border:1px solid var(--brass);
    border-radius:8px;
    padding:12px 16px;
    font-size:13px;
    line-height:1.7;
    color:#4A3A17;
  }
  .howto b{color:var(--brass-d);}
  /* ---- Layout below header ---- */
  .body-row{
    display:flex;
    flex:1;
  }
  /* ---- Tab rail ---- */
  .rail{
    width:104px;
    flex-shrink:0;
    padding:18px 0;
    border-right:1px solid var(--line);
  }
  .rail-group-label{
    font-size:10px;
    letter-spacing:0.12em;
    color:var(--ink-soft);
    padding:6px 0 6px 16px;
  }
  .tab{
    display:flex;
    align-items:baseline;
    gap:6px;
    width:92px;
    margin:2px 0 2px auto;
    padding:8px 0 8px 16px;
    background:var(--card);
    border:1px solid var(--line);
    border-right:none;
    border-radius:8px 0 0 8px;
    cursor:pointer;
    font-family:'IBM Plex Mono',monospace;
    color:var(--ink-soft);
    transition:all .12s ease;
  }
  .tab:hover{background:var(--paper-2);}
  .tab .n{font-size:16px;font-weight:600;color:var(--ink);}
  .tab .p{font-size:10px;}
  .tab.active{
    width:104px;
    background:var(--card);
    border-color:var(--fairway);
    color:var(--fairway);
    box-shadow:var(--shadow);
  }
  .tab.active .n{color:var(--fairway);}
  .tab.out.active{border-color:var(--fairway);color:var(--fairway);}
  .tab.out.active .n{color:var(--fairway);}
  .tab.in.active{border-color:var(--brass-d);color:var(--brass-d);}
  .tab.in.active .n{color:var(--brass-d);}
  /* ---- Main page ---- */
  .page-wrap{
    flex:1;
    padding:22px 28px 60px;
    min-width:0;
  }
  .page{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:var(--shadow);
    padding:24px 26px 28px;
  }
  .hole-head{
    display:flex;
    align-items:center;
    gap:18px;
    padding-bottom:16px;
    border-bottom:1px solid var(--line);
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .hole-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:52px;
    color:var(--pine);
    line-height:1;
  }
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:13px;
    padding:5px 11px;
    border-radius:20px;
    font-weight:600;
  }
  .badge.par{background:var(--fairway-l);color:var(--fairway);}
  .badge.hdcp{background:var(--hazard-l);color:var(--hazard);}
  .badge.yd{background:var(--paper-2);color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;}
  .hole-note{
    font-size:13px;
    color:var(--brass-d);
    background:var(--brass-l);
    border-radius:6px;
    padding:5px 10px;
  }
  /* ---- yardage table ---- */
  table.yard{
    width:100%;
    border-collapse:collapse;
    font-family:'IBM Plex Mono',monospace;
    margin-bottom:22px;
  }
  table.yard th, table.yard td{
    border:1px solid var(--line);
    padding:8px 6px;
    text-align:center;
    font-size:14px;
  }
  table.yard th{
    background:var(--paper-2);
    color:var(--ink-soft);
    font-weight:500;
    font-size:11px;
    letter-spacing:.03em;
  }
  table.yard td.tee{
    text-align:left;
    font-family:'Inter',sans-serif;
    font-size:12px;
    color:var(--ink-soft);
    background:var(--paper-2);
  }
  table.yard td.val{font-size:16px;color:var(--ink);}
  /* ---- two column area ---- */
  .illust-box{
    width:100%;
    max-width:260px;
    height:280px;
    margin:0 auto;
    border:1px solid var(--line);
    border-radius:8px;
    overflow:hidden;
    background:var(--card);
  }
  .stat-row{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    color:var(--ink-soft);
  }
  .stat-row b{color:var(--ink);}
  .cols{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
  }
  @media (max-width:820px){ .cols{grid-template-columns:1fr;} }
  @media (max-width:680px){
    html, body{
      overflow-x:hidden;
      width:100%;
      height:100%;
    }
    .frame{ max-width:100%; width:100%; min-width:0; height:100dvh; }
    .frame > div{ min-width:0; height:100%; }
    .top{ padding:8px 12px 6px; flex-shrink:0; }
    .top-title{ font-size:15px; }
    .stat-strip{ display:none; }
    .howto{ display:none; }

    .body-row{ flex-direction:row; min-width:0; width:100%; flex:1; min-height:0; }
    .rail{
      width:52px;
      flex-shrink:0;
      box-sizing:border-box;
      display:flex;
      flex-direction:column;
      align-items:flex-end;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding:6px 0;
      border-right:1px solid var(--line);
      border-bottom:none;
      gap:7px;
    }
    .rail-group-label{
      padding:4px 0 2px 0;
      display:block;
      width:100%;
      text-align:center;
      flex-shrink:0;
      white-space:nowrap;
      font-size:8px;
    }
    .tab{
      flex-shrink:0;
      width:32px;
      margin:0 2px 0 auto;
      border-radius:6px;
      border:1px solid var(--line);
      padding:7px 0;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:0;
    }
    .tab .n{ font-size:13px; }
    .tab .p{ display:none; }
    .tab.active{ width:36px; }
    .rail{ width:40px; }

    .page-wrap{
      padding:8px 10px;
      min-width:0;
      flex:1;
      box-sizing:border-box;
      min-height:0;
      overflow-y:auto;
      display:flex;
      flex-direction:column;
    }
    .page{
      padding:10px 10px 8px;
      min-width:0;
      width:100%;
      box-sizing:border-box;
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .hole-head{ gap:8px; padding-bottom:6px; margin-bottom:6px; flex-shrink:0; }
    .hole-num{ font-size:24px; }
    .badge{ font-size:10px; padding:3px 7px; }

    /* Course illustration is the priority: let it fill remaining space */
    .page > div[style*="margin-top:20px"]{
      flex:1;
      min-height:0;
      display:flex;
      flex-direction:column;
      margin-top:0 !important;
    }
    .canvas-tools{ max-width:100%; flex-shrink:0; gap:4px; margin-bottom:6px; }
    .canvas-tools button{ padding:4px 7px; font-size:11px; }
    .illust-box{ max-width:100%; width:100%; }
    #sketch{
      flex:1;
      min-height:0;
      width:100%;
      height:100%;
      aspect-ratio:unset;
      object-fit:contain;
      margin:0 auto;
      display:block;
    }

    /* Notes and controls: kept, but minimized since illustration is the focus */
    .notes-area{ margin-top:6px; flex-shrink:0; }
    .notes-area .panel-title{ font-size:10px; margin-bottom:4px; }
    .notes-area textarea{ min-height:34px; font-size:11px; padding:6px 8px; }
    .save-state{ font-size:10px; height:auto; margin-top:2px; }

    #prevHole, #nextHole, #btnExport, #btnImportTrigger, .print-btn{ display:none !important; }
  }
  .panel-title{
    font-size:12px;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin:0 0 8px;
    text-transform:uppercase;
  }
  .canvas-tools{
    display:flex;
    gap:6px;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:8px;
  }
  .canvas-tools button{
    font-family:'Inter',sans-serif;
    font-size:12px;
    padding:6px 9px;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--card);
    cursor:pointer;
    color:var(--ink);
  }
  .canvas-tools button:hover{background:var(--paper-2);}
  .canvas-tools button.active-tool{
    background:var(--fairway);
    color:#fff;
    border-color:var(--fairway);
  }
  .swatch{
    width:20px;height:20px;border-radius:50%;
    border:2px solid transparent;
    cursor:pointer;
    padding:0;
  }
  .swatch.active{border-color:var(--ink);}
  #sketch{
    width:100%;
    max-width:260px;
    aspect-ratio:13/14;
    height:auto;
    display:block;
    margin:0 auto;
    border:1px dashed var(--line);
    border-radius:8px;
    background:repeating-linear-gradient(45deg, var(--paper-2) 0 2px, var(--card) 2px 14px);
    cursor:crosshair;
    touch-action:none;
  }
  .drop-hint{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
  }
  .notes-area{
    margin-top:18px;
  }
  textarea{
    width:100%;
    min-height:90px;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-family:'Inter',sans-serif;
    font-size:13px;
    color:var(--ink);
    background:var(--paper);
    resize:vertical;
  }
  .save-state{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
    height:14px;
  }
  .toolbar-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
  }
  .print-btn{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:9px 16px;
    border-radius:8px;
    border:1px solid var(--pine);
    background:var(--pine);
    color:var(--paper);
    cursor:pointer;
  }
  .nav-btns{display:flex;gap:8px;}
  .nav-btns button{
    font-family:'Inter',sans-serif;
    font-size:13px;
    padding:9px 14px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    cursor:pointer;
  }
  .nav-btns button:hover{background:var(--paper-2);}

  @media print{
    @page{ size:A4; margin:0; }
    body{ background:#fff; }
    .frame{ display:none !important; }
    #printRoot{ display:block !important; }
    *{
      -webkit-print-color-adjust:exact !important;
      print-color-adjust:exact !important;
      color-adjust:exact !important;
    }
  }
  #printRoot{ display:none; }
  .a4-sheet{
    width:190mm;
    height:277mm;
    margin:10mm auto 0;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    page-break-after:always;
  }
  .a4-sheet:last-child{ page-break-after:auto; }
  .hole-card{
    border-right:1.5pt dashed #333;
    border-bottom:1.5pt dashed #333;
    padding:2.5mm 2.2mm;
    box-sizing:border-box;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;
    font-family:'Inter',sans-serif;
    color:var(--ink);
  }
  .hole-card:nth-child(3n){ border-right:none; }
  .hole-card:nth-child(n+4){ border-bottom:none; }
  .hc-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:0.8pt solid var(--ink);
    padding-bottom:1mm;
    margin-bottom:1mm;
  }
  .hc-num{
    font-family:'Fraunces',serif;
    font-weight:700;
    font-size:13pt;
    line-height:1;
  }
  .hc-badges{
    font-family:'IBM Plex Mono',monospace;
    font-size:6.5pt;
    color:var(--ink-soft);
  }
  .hc-photo{
    flex:1;
    min-height:0;
    position:relative;
    overflow:hidden;
  }
  .hc-photo img, .hc-photo svg{
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
    display:block;
  }
  .hc-memo{
    font-family:'Inter',sans-serif;
    font-size:6pt;
    line-height:1.35;
    color:var(--ink-soft);
    text-align:left;
    margin-top:0.8mm;
    white-space:pre-wrap;
    height:10mm;
    flex-shrink:0;
    overflow:hidden;
  }
  .hc-yard{
    font-family:'IBM Plex Mono',monospace;
    font-size:6.5pt;
    color:var(--ink);
    margin-top:1mm;
    text-align:center;
  }
  .hole-card-rotated{
    transform:rotate(180deg);
    border-right:none;
    border-bottom:none;
    border-left:1.5pt dashed #333;
    border-top:1.5pt dashed #333;
  }
  .hole-card-rotated:nth-child(3n){ border-left:none; }
  .hole-card-rotated:nth-child(n+4){ border-top:none; }
  .hole-card-blank{
    background:repeating-linear-gradient(45deg,#f7f7f7 0 2px,#fff 2px 12px);
  }
  .hc-note{
    font-size:6pt;
    color:var(--brass-d);
    text-align:center;
    margin-top:0.5mm;
    height:2.6mm;
    flex-shrink:0;
    overflow:hidden;
  }
</style>
</head>
<body>
<div id="printRoot"></div>
<div class="frame">
  <div style="flex:1;display:flex;flex-direction:column;">
    <div class="top">
      <p class="top-title">チェックメイト カントリークラブ</p>
    </div>

    <div class="body-row">
      <div class="rail" id="rail"></div>
      <div class="page-wrap">
        <div class="page">
          <div class="hole-head">
            <div class="hole-num" id="holeNum">1</div>
            <div class="badge par" id="badgePar">PAR 5</div>
            <div class="badge yd" id="badgeFB">FB 549Y</div>
            <div class="badge yd" id="badgeB">B 519Y</div>
          </div>

          <div style="margin-top:20px;">
            <div class="canvas-tools">
              <button id="btnDrawMode" title="ONの間だけイラストへの書き込みができます。OFFの間は触れても書き込まれません（スワイプでのホール移動もOFFの時のみ有効）">描画OFF</button>
              <button id="btnSelect" title="図形を選択して移動・拡大縮小・色変更・削除">選択</button>
              <button id="btnLine" title="直線">／</button>
              <button id="btnTShape" title="T字（着弾点の左右ブレ幅）">⊥</button>
              <label style="font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:3px;">
                幅<input type="number" id="tWidth" value="100" min="6" max="200" step="2" style="width:44px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;">
              </label>
              <button id="btnStar" title="星を挿入">★</button>
              <button id="btnCircle" title="○を挿入">○</button>
              <label style="font-size:11px;color:var(--ink-soft);display:flex;align-items:center;gap:3px;">
                サイズ<input type="number" id="iconSize" value="2" min="1" max="4" step="0.5" style="width:44px;padding:2px 4px;border:1px solid var(--line);border-radius:4px;">
              </label>
              <button class="swatch active" data-color="#241F17" style="background:#241F17;"></button>
              <button class="swatch" data-color="#E8B93A" style="background:#E8B93A;"></button>
              <button class="swatch" data-color="#B8231E" style="background:#B8231E;"></button>
              <button id="btnUndo">戻す</button>
              <button id="btnDelete" title="選択中の図形を削除">削除</button>
              <button id="btnReset">リセット</button>
            </div>
            <canvas id="sketch" width="520" height="560"></canvas>
          </div>

          <div class="notes-area">
            <p class="panel-title">メモ（グリーン形状・ハザードまでの距離・攻め方など）</p>
            <textarea id="notes"></textarea>
            <div class="save-state" id="saveState"></div>
          </div>

          <div class="toolbar-bottom">
            <div class="nav-btns">
              <button id="prevHole">← 前のホール</button>
              <button id="nextHole">次のホール →</button>
              <button id="btnExport" title="全ホールの書き込みをファイルに保存">書き込みを書き出す</button>
              <button id="btnImportTrigger" title="書き出したファイルを読み込む">書き込みを読み込む</button>
              <input type="file" id="btnImport" accept="application/json" style="display:none;">
            </div>
            <button class="print-btn" id="printBtn">イラスト版を印刷（A4両面・短辺とじ）</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const STORE_PREFIX = 'cmcc_ybk_';
const BOOK_ID = 'cm18yb';

let fsReady = false;
let fsCache = {};
let authReadyPromise = Promise.resolve(null);

(function initFirebase(){
  try{
    const firebaseConfig = {
      apiKey: "AIzaSyAu8LfEz1c8yAhy4NIjetRkyZmaN8qfT-g",
      authDomain: "checkmate-yardage-book.firebaseapp.com",
      projectId: "checkmate-yardage-book",
      storageBucket: "checkmate-yardage-book.firebasestorage.app",
      messagingSenderId: "155918852101",
      appId: "1:155918852101:web:35963956850d7ce8be3c6c"
    };
    if(typeof firebase === 'undefined') return;
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
    const bookDocRef = db.collection('books').doc(BOOK_ID);
    window.__cmccBookRef = bookDocRef;

    authReadyPromise = new Promise((resolve)=>{
      firebase.auth().onAuthStateChanged(user=>{
        if(user){
          fsReady = true;
          bookDocRef.onSnapshot(snap=>{
            if(snap.exists) fsCache = snap.data() || {};
          }, ()=>{});
          resolve(user);
        }
      });
      firebase.auth().signInAnonymously().catch(()=> resolve(null));
    });
  }catch(e){
    console.error('Firebase init failed', e);
  }
})();

function cmccTimeout(ms){
  return new Promise(resolve => setTimeout(()=>resolve(null), ms));
}
async function ensureAuthReady(){
  try{ await Promise.race([authReadyPromise, cmccTimeout(4000)]); }catch(e){}
}

const Store = {
  async get(key){
    try{
      await ensureAuthReady();
      if(fsReady && window.__cmccBookRef){
        if(Object.prototype.hasOwnProperty.call(fsCache, key)){
          return {key, value: fsCache[key]};
        }
        const snap = await window.__cmccBookRef.get();
        if(snap.exists){
          fsCache = snap.data() || {};
          if(Object.prototype.hasOwnProperty.call(fsCache, key)){
            return {key, value: fsCache[key]};
          }
        }
      }
    }catch(e){}
    try{
      const raw = localStorage.getItem(STORE_PREFIX + key);
      if(raw !== null) return {key, value: raw};
    }catch(e){}
    return null;
  },
  async set(key, value){
    let ok = false;
    try{
      await ensureAuthReady();

function svgMarkup(h){
  let pathD;
  if(h.dogleg==='left'){ pathD = "M50,190 C50,148 14,134 14,104 C14,74 46,56 50,20"; }
  else if(h.dogleg==='right'){ pathD = "M50,190 C50,148 86,134 86,104 C86,74 54,56 50,20"; }
  else { pathD = "M50,190 C47,140 53,90 50,20"; }

  let hazardSVG = '';
  if(h.hazard === 'pond-green'){
    hazardSVG = '<ellipse cx="50" cy="37" rx="19" ry="8.5" fill="#35586B" opacity="0.55"/><text x="50" y="40" font-size="7" fill="#0E2430" text-anchor="middle" font-family="sans-serif">池</text>';
  } else if(h.hazard === 'pond'){
    hazardSVG = '<ellipse cx="52" cy="98" rx="23" ry="9.5" fill="#35586B" opacity="0.5" transform="rotate(-8 52 98)"/><text x="52" y="101" font-size="7" fill="#0E2430" text-anchor="middle" font-family="sans-serif">池</text>';
  }
  const dogLabel = h.dogleg==='left' ? '← 左ドッグレッグ' : h.dogleg==='right' ? '右ドッグレッグ →' : '';

  return `<svg viewBox="0 0 100 210" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;display:block;">
    <rect x="0" y="0" width="100" height="210" fill="#FBF7EC"/>
    <path d="${pathD}" stroke="#7FA06F" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.55"/>
    ${hazardSVG}
    <ellipse cx="50" cy="20" rx="13" ry="10" fill="#3E5D3B" opacity="0.9"/>
    <line x1="50" y1="20" x2="50" y2="5" stroke="#8A6B33" stroke-width="1"/>
    <path d="M50,5 l8,3 l-8,3 z" fill="#B8231E"/>
    <circle cx="46" cy="192" r="2.2" fill="#8A6B33"/>
    <circle cx="50" cy="193" r="2.2" fill="#8A6B33"/>
    <circle cx="54" cy="192" r="2.2" fill="#8A6B33"/>
    ${dogLabel ? `<text x="50" y="204" font-size="7" fill="#5A5142" text-anchor="middle" font-family="sans-serif">${dogLabel}</text>` : ''}
  </svg>`;
}

const rail = document.getElementById('rail');
function buildRail(){
  let html = '<div class="rail-group-label">OUT</div>';
  HOLES.slice(0,9).forEach(h=>{
    html += `<div class="tab out" data-n="${h.n}"><span class="n">${h.n}</span><span class="p">P${h.par}</span></div>`;
  });
  html += '<div class="rail-group-label" style="margin-top:10px;">IN</div>';
  HOLES.slice(9).forEach(h=>{
    html += `<div class="tab in" data-n="${h.n}"><span class="n">${h.n}</span><span class="p">P${h.par}</span></div>`;
  });
  rail.innerHTML = html;
  rail.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=> loadHole(parseInt(t.dataset.n)));
  });
}
buildRail();

function updateRailActive(){
  rail.querySelectorAll('.tab').forEach(t=>{
    t.classList.toggle('active', parseInt(t.dataset.n) === current);
  });
}

// Loads the hole's illustration and sizes the canvas to its exact
// native aspect ratio (no letterboxing), so annotated illustrations
// print at the same scale as the plain ones. Calls back with the
// loaded Image (or null if there is none) once the canvas is sized.
function prepareCanvasForHole(h, callback){
  const src = HOLE_IMG[h.n];
  if(!src){ callback(null); return; }
  const img = new Image();
  img.onload = () => {
    let w = img.naturalWidth || img.width, hh = img.naturalHeight || img.height;
    const maxDim = Math.max(w, hh);
    if(maxDim > MAX_CANVAS_DIM){
      const scale = MAX_CANVAS_DIM / maxDim;
      w = Math.round(w * scale); hh = Math.round(hh * scale);
    }
    setCanvasAspect(w, hh);
    callback(img);
  };
  img.onerror = () => callback(null);
  img.src = src;
}

function clearCanvasVisual(){
  ctx.fillStyle = '#FBF7EC';
  ctx.fillRect(0,0,canvas.width,canvas.height);
}
clearCanvasVisual();

function pushUndo(){
  try{
    undoStack.push(JSON.stringify({shapes: shapes, legacyImage: legacyImage}));
    if(undoStack.length > 15) undoStack.shift();
  }catch(e){}
}

function getPos(e){
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  let clientX, clientY;
  if(e.touches && e.touches.length){
    clientX = e.touches[0].clientX; clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX; clientY = e.clientY;
  }
  return {x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY};
}

function drawStarPath(targetCtx, cx, cy, outerR, innerR, spikes){
  let rot = -Math.PI / 2;
  const step = Math.PI / spikes;
  targetCtx.beginPath();
  targetCtx.moveTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
  for(let i = 0; i < spikes; i++){
    rot += step;
    targetCtx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
    targetCtx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
  }
  targetCtx.closePath();
}

function makeShapeId(){
  return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}

function createIconShape(kind, x, y){
  const size = Math.max(canvas.width, canvas.height) * (iconSizeScale / 100);
  return {id: makeShapeId(), type: kind, x, y, size, color: penColor};
}

// Draws one shape's permanent geometry onto any 2D context (the live
// canvas or an offscreen one used for printing). Selection highlighting
// is handled separately since printed output never has a selection.
function paintShape(targetCtx, s){
  targetCtx.save();
  targetCtx.strokeStyle = s.color;
  targetCtx.fillStyle = s.color;
  if(s.type === 'line'){
    targetCtx.lineWidth = 1.4;
    targetCtx.lineCap = 'round';
    targetCtx.beginPath();
    targetCtx.moveTo(s.x1, s.y1);
    targetCtx.lineTo(s.x2, s.y2);
    targetCtx.stroke();
  } else if(s.type === 'tshape'){
    const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const perpX = -uy, perpY = ux;
    const halfW = (s.width || 100) / 2;
    targetCtx.lineWidth = 1.4;
    targetCtx.lineCap = 'round';
    targetCtx.beginPath();
    targetCtx.moveTo(s.x1, s.y1);
    targetCtx.lineTo(s.x2, s.y2);
    targetCtx.stroke();
    targetCtx.beginPath();
    targetCtx.moveTo(s.x2 - perpX * halfW, s.y2 - perpY * halfW);
    targetCtx.lineTo(s.x2 + perpX * halfW, s.y2 + perpY * halfW);
    targetCtx.stroke();
  } else if(s.type === 'star'){
    drawStarPath(targetCtx, s.x, s.y, s.size, s.size * 0.45, 5);
    targetCtx.fill();
  } else if(s.type === 'circle'){
    targetCtx.lineWidth = s.size * 0.18;
    targetCtx.beginPath();
    targetCtx.arc(s.x, s.y, s.size * 0.7, 0, Math.PI * 2);
    targetCtx.stroke();
  }
  targetCtx.restore();
}

function drawHandleDot(x, y){
  ctx.save();
  ctx.fillStyle = '#2F6FD6';
  ctx.beginPath();
  ctx.arc(x, y, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function drawSelectionOverlay(s){
  ctx.save();
  ctx.strokeStyle = '#2F6FD6';
  ctx.setLineDash([4,3]);
  ctx.lineWidth = 1;
  if(s.type === 'line' || s.type === 'tshape'){
    ctx.beginPath();
    ctx.moveTo(s.x1, s.y1);
    ctx.lineTo(s.x2, s.y2);
    ctx.stroke();
    ctx.setLineDash([]);
    drawHandleDot(s.x1, s.y1);
    drawHandleDot(s.x2, s.y2);
  } else {
    const r = (s.size || 20) * 0.95;
    ctx.beginPath();
    ctx.arc(s.x, s.y, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    drawHandleDot(s.x + r, s.y);
  }
  ctx.restore();
}

function drawAllShapes(){
  for(const s of shapes){
    paintShape(ctx, s);
    if(s.id === selectedShapeId) drawSelectionOverlay(s);
  }
}

// Repaints the whole visible canvas: background (either the frozen
// legacy raster from before this upgrade, or the hole's plain
// illustration) followed by every editable shape on top.
function renderCanvasFull(){
  if(legacyImage){
    if(legacyImageEl && legacyImageSrc === legacyImage && legacyImageEl.complete){
      clearCanvasVisual();
      ctx.drawImage(legacyImageEl, 0, 0, canvas.width, canvas.height);
      drawAllShapes();
    } else {
      const img = new Image();
      legacyImageSrc = legacyImage;
      img.onload = () => {
        legacyImageEl = img;
        if(legacyImageSrc === legacyImage){
          clearCanvasVisual();
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          drawAllShapes();
        }
      };
      img.src = legacyImage;
    }
  } else {
    clearCanvasVisual();
    if(baseIllustrationImg) ctx.drawImage(baseIllustrationImg, 0, 0, canvas.width, canvas.height);
    drawAllShapes();
  }
}

function distToSegment(px, py, x1, y1, x2, y2){
  const dx = x2 - x1, dy = y2 - y1;
  const lenSq = dx*dx + dy*dy;
  let t = lenSq ? ((px-x1)*dx + (py-y1)*dy) / lenSq : 0;
  t = Math.max(0, Math.min(1, t));
  const cx = x1 + t*dx, cy = y1 + t*dy;
  return Math.hypot(px-cx, py-cy);
}

function hitTestShapes(x, y){
  const threshold = Math.max(canvas.width, canvas.height) * 0.02 + 6;
  for(let i = shapes.length - 1; i >= 0; i--){
    const s = shapes[i];
    if(s.type === 'line' || s.type === 'tshape'){
      if(distToSegment(x, y, s.x1, s.y1, s.x2, s.y2) <= threshold) return s;
      if(s.type === 'tshape'){
        const dx = s.x2 - s.x1, dy = s.y2 - s.y1;
        const len = Math.hypot(dx, dy) || 1;
        const ux = dx/len, uy = dy/len;
        const perpX = -uy, perpY = ux;
        const halfW = (s.width || 100) / 2;
        const bx1 = s.x2 - perpX*halfW, by1 = s.y2 - perpY*halfW;
        const bx2 = s.x2 + perpX*halfW, by2 = s.y2 + perpY*halfW;
        if(distToSegment(x, y, bx1, by1, bx2, by2) <= threshold) return s;
      }
    } else if(s.type === 'star' || s.type === 'circle'){
      const r = Math.max((s.size || 1) * 0.9, threshold);
      if(Math.hypot(x - s.x, y - s.y) <= r) return s;
    }
  }
  return null;
}

function hitTestHandle(s, p){
  const R = Math.max(canvas.width, canvas.height) * 0.025 + 8;
  if(s.type === 'line' || s.type === 'tshape'){
    if(Math.hypot(p.x - s.x1, p.y - s.y1) <= R) return 'p1';
    if(Math.hypot(p.x - s.x2, p.y - s.y2) <= R) return 'p2';
  } else if(s.type === 'star' || s.type === 'circle'){
    const r = (s.size || 20) * 0.95;
    const hx = s.x + r, hy = s.y;
    if(Math.hypot(p.x - hx, p.y - hy) <= R) return 'resize';
  }
  return null;
}

function applySelectDrag(shape, mode, startPos, curPos){
  if(mode === 'move'){
    const dx = curPos.x - startPos.x, dy = curPos.y - startPos.y;
    if(shape.type === 'line' || shape.type === 'tshape'){
      shape.x1 += dx; shape.y1 += dy; shape.x2 += dx; shape.y2 += dy;
    } else {
      shape.x += dx; shape.y += dy;
    }
    return curPos;
  } else if(mode === 'p1'){
    shape.x1 = curPos.x; shape.y1 = curPos.y;
    return startPos;
  } else if(mode === 'p2'){
    shape.x2 = curPos.x; shape.y2 = curPos.y;
    return startPos;
  } else if(mode === 'resize'){
    shape.size = Math.max(4, Math.hypot(curPos.x - shape.x, curPos.y - shape.y) / 0.95);
    return startPos;
  }
  return startPos;
}

// After selecting (or newly placing) a shape, reflect its current
// color/size in the toolbar controls so they don't show stale values.
function syncControlsToSelection(){
  const sel = shapes.find(s => s.id === selectedShapeId);
  if(!sel) return;
  if(sel.color){
    penColor = sel.color;
    document.querySelectorAll('.swatch').forEach(sw => sw.classList.toggle('active', sw.dataset.color === sel.color));
  }
  if(sel.type === 'star' || sel.type === 'circle'){
    const pct = Math.round((sel.size / Math.max(canvas.width, canvas.height)) * 1000) / 10;
    iconSizeScale = pct;
    document.getElementById('iconSize').value = pct;
  } else if(sel.type === 'tshape'){
    tShapeWidth = sel.width || 100;
    document.getElementById('tWidth').value = tShapeWidth;
  }
}

function startDraw(e){
  if(!drawModeOn) return;
  e.preventDefault();
  const p = getPos(e);

  if(tool === 'select'){
    const sel = shapes.find(s => s.id === selectedShapeId) || null;
    const handleHit = sel ? hitTestHandle(sel, p) : null;
    if(sel && handleHit){
      pushUndo();
      selectDragMode = handleHit;
      selectDragShape = sel;
      selectDragStartPos = p;
      drawing = true;
      return;
    }
    const hit = hitTestShapes(p.x, p.y);
    if(hit){
      pushUndo();
      selectedShapeId = hit.id;
      selectDragMode = 'move';
      selectDragShape = hit;
      selectDragStartPos = p;
      drawing = true;
      syncControlsToSelection();
    } else {
      selectedShapeId = null;
      drawing = false;
    }
    renderCanvasFull();
    return;
  }

  pushUndo();
  drawing = true;
  lastX = p.x; lastY = p.y;
  lineStartX = p.x; lineStartY = p.y;
  if(tool === 'line' || tool === 'tshape'){
    lineSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
  } else if(tool === 'star' || tool === 'circle'){
    const shape = createIconShape(tool, p.x, p.y);
    shapes.push(shape);
    selectedShapeId = shape.id;
    syncControlsToSelection();
    renderCanvasFull();
    scheduleSave();
  }
}
function moveDraw(e){
  if(!drawing) return;
  e.preventDefault();
  const p = getPos(e);

  if(tool === 'select'){
    if(!selectDragShape || !selectDragMode) return;
    selectDragStartPos = applySelectDrag(selectDragShape, selectDragMode, selectDragStartPos, p);
    renderCanvasFull();
    return;
  }

  if(tool === 'line'){
    ctx.putImageData(lineSnapshot, 0, 0);
    ctx.strokeStyle = penColor;
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(lineStartX, lineStartY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  } else if(tool === 'tshape'){
    ctx.putImageData(lineSnapshot, 0, 0);
    const dx = p.x - lineStartX, dy = p.y - lineStartY;
    const len = Math.hypot(dx, dy) || 1;
    const ux = dx / len, uy = dy / len;
    const perpX = -uy, perpY = ux;
    const halfW = tShapeWidth / 2;
    ctx.strokeStyle = penColor;
    ctx.lineWidth = 1.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(lineStartX, lineStartY);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(p.x - perpX * halfW, p.y - perpY * halfW);
    ctx.lineTo(p.x + perpX * halfW, p.y + perpY * halfW);
    ctx.stroke();
    lastX = p.x; lastY = p.y;
  }
  // star/circle tools ignore drag movement — they stamp once on mousedown
}
function endDraw(){
  if(!drawing) return;
  drawing = false;

  if(tool === 'select'){
    if(selectDragShape){
      syncControlsToSelection();
      scheduleSave();
    }
    selectDragMode = null;
    selectDragShape = null;
    selectDragStartPos = null;
    return;
  }

  if(tool === 'line' || tool === 'tshape'){
    const dist = Math.hypot(lastX - lineStartX, lastY - lineStartY);
    if(dist > 3){
      const shape = (tool === 'line')
        ? {id: makeShapeId(), type: 'line', x1: lineStartX, y1: lineStartY, x2: lastX, y2: lastY, color: penColor}
        : {id: makeShapeId(), type: 'tshape', x1: lineStartX, y1: lineStartY, x2: lastX, y2: lastY, width: tShapeWidth, color: penColor};
      shapes.push(shape);
      selectedShapeId = shape.id;
    }
    renderCanvasFull();
  }

  lineSnapshot = null;
  scheduleSave();
}

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
window.addEventListener('mouseup', endDraw);
canvas.addEventListener('touchstart', startDraw, {passive:false});
canvas.addEventListener('touchmove', moveDraw, {passive:false});
canvas.addEventListener('touchend', endDraw);

const drawModeBtn = document.getElementById('btnDrawMode');
function updateDrawModeBtn(){
  drawModeBtn.textContent = drawModeOn ? '描画ON' : '描画OFF';
  drawModeBtn.classList.toggle('active-tool', drawModeOn);
  canvas.style.touchAction = drawModeOn ? 'none' : 'auto';
}
drawModeBtn.addEventListener('click', ()=>{
  drawModeOn = !drawModeOn;
  updateDrawModeBtn();
});
updateDrawModeBtn();

document.querySelectorAll('.swatch').forEach(sw=>{
  sw.addEventListener('click', ()=>{
    document.querySelectorAll('.swatch').forEach(s=>s.classList.remove('active'));
    sw.classList.add('active');
    penColor = sw.dataset.color;
    const sel = shapes.find(s => s.id === selectedShapeId);
    if(sel){
      pushUndo();
      sel.color = penColor;
      renderCanvasFull();
      scheduleSave();
    }
  });
});
function setActiveToolButton(id){
  ['btnSelect','btnLine','btnTShape','btnStar','btnCircle'].forEach(bid=>{
    document.getElementById(bid).classList.toggle('active-tool', bid === id);
  });
}
document.getElementById('btnSelect').addEventListener('click', ()=>{ tool = 'select'; setActiveToolButton('btnSelect'); });
document.getElementById('btnLine').addEventListener('click', ()=>{ tool = 'line'; setActiveToolButton('btnLine'); });
document.getElementById('btnTShape').addEventListener('click', ()=>{ tool = 'tshape'; setActiveToolButton('btnTShape'); });
document.getElementById('btnStar').addEventListener('click', ()=>{ tool = 'star'; setActiveToolButton('btnStar'); });
document.getElementById('btnCircle').addEventListener('click', ()=>{ tool = 'circle'; setActiveToolButton('btnCircle'); });
document.getElementById('tWidth').addEventListener('input', (e)=>{
  const v = parseInt(e.target.value, 10);
  if(!isNaN(v) && v > 0){
    tShapeWidth = v;
    const sel = shapes.find(s => s.id === selectedShapeId);
    if(sel && sel.type === 'tshape'){
      sel.width = v;
      renderCanvasFull();
      scheduleSave();
    }
  }
});
document.getElementById('iconSize').addEventListener('input', (e)=>{
  const v = parseFloat(e.target.value);
  if(!isNaN(v) && v > 0){
    iconSizeScale = v;
    const sel = shapes.find(s => s.id === selectedShapeId);
    if(sel && (sel.type === 'star' || sel.type === 'circle')){
      sel.size = Math.max(canvas.width, canvas.height) * (v / 100);
      renderCanvasFull();
      scheduleSave();
    }
  }
});
document.getElementById('btnUndo').addEventListener('click', ()=>{
  const prev = undoStack.pop();
  if(!prev) return;
  try{
    const state = JSON.parse(prev);
    shapes = state.shapes || [];
    legacyImage = state.legacyImage || null;
    legacyImageEl = null; legacyImageSrc = null;
    selectedShapeId = null;
    renderCanvasFull();
    scheduleSave();
  }catch(e){}
});
document.getElementById('btnDelete').addEventListener('click', ()=>{
  if(!selectedShapeId) return;
  pushUndo();
  shapes = shapes.filter(s => s.id !== selectedShapeId);
  selectedShapeId = null;
  renderCanvasFull();
  scheduleSave();
});
document.addEventListener('keydown', (e)=>{
  if(e.key !== 'Delete' && e.key !== 'Backspace') return;
  const activeTag = document.activeElement && document.activeElement.tagName;
  if(activeTag === 'TEXTAREA' || activeTag === 'INPUT') return;
  if(!selectedShapeId) return;
  e.preventDefault();
  document.getElementById('btnDelete').click();
});
document.getElementById('btnReset').addEventListener('click', ()=>{
  if(!confirm('このホールの書き込みを消去して、元のイラストに戻します。よろしいですか？')) return;
  pushUndo();
  shapes = [];
  legacyImage = null;
  legacyImageEl = null; legacyImageSrc = null;
  selectedShapeId = null;
  renderCanvasFull();
  scheduleSave();
});

function drawImageToCanvas(imgSrc){
  pushUndo();
  const img = new Image();
  img.onload = ()=>{
    const off = document.createElement('canvas');
    off.width = canvas.width; off.height = canvas.height;
    const octx = off.getContext('2d');
    octx.fillStyle = '#FBF7EC';
    octx.fillRect(0, 0, off.width, off.height);
    const cw = canvas.width, ch = canvas.height;
    const ir = img.width/img.height, cr = cw/ch;
    let dw,dh,dx,dy;
    if(ir > cr){ dw = cw; dh = cw/ir; dx = 0; dy = (ch-dh)/2; }
    else { dh = ch; dw = ch*ir; dx = (cw-dw)/2; dy = 0; }
    octx.drawImage(img, dx, dy, dw, dh);
    legacyImage = off.toDataURL('image/png');
    legacyImageEl = null; legacyImageSrc = null;
    shapes = [];
    selectedShapeId = null;
    renderCanvasFull();
    scheduleSave();
  };
  img.src = imgSrc;
}

canvas.addEventListener('dragover', e=>{ e.preventDefault(); });
canvas.addEventListener('drop', e=>{
  e.preventDefault();
  const file = e.dataTransfer.files && e.dataTransfer.files[0];
  if(file && file.type.startsWith('image/')){
    const reader = new FileReader();
    reader.onload = ev => drawImageToCanvas(ev.target.result);
    reader.readAsDataURL(file);
  }
});
canvas.tabIndex = 0;
canvas.addEventListener('paste', e=>{
  const items = e.clipboardData && e.clipboardData.items;
  if(!items) return;
  for(const item of items){
    if(item.type.indexOf('image') !== -1){
      const blob = item.getAsFile();
      const reader = new FileReader();
      reader.onload = ev => drawImageToCanvas(ev.target.result);
      reader.readAsDataURL(blob);
    }
  }
});
document.addEventListener('paste', e=>{
  if(document.activeElement === canvas){
    const items = e.clipboardData && e.clipboardData.items;
    if(!items) return;
    for(const item of items){
      if(item.type.indexOf('image') !== -1){
        const blob = item.getAsFile();
        const reader = new FileReader();
        reader.onload = ev => drawImageToCanvas(ev.target.result);
        reader.readAsDataURL(blob);
      }
    }
  }
});

let saveTimer = null;
function scheduleSave(){
  clearTimeout(saveTimer);
  document.getElementById('saveState').textContent = '保存中…';
  saveTimer = setTimeout(saveCurrentHole, 500);
}

async function saveCurrentHole(){
  try{
    const data = {
      notes: document.getElementById('notes').value,
      shapes: shapes,
      legacyImage: legacyImage || null
    };
    await Store.set(`hole-${current}`, JSON.stringify(data));
    document.getElementById('saveState').textContent = '保存済み';
  }catch(e){
    document.getElementById('saveState').textContent = '';
  }
}

document.getElementById('notes').addEventListener('input', scheduleSave);

let hasLoadedOnce = false;
async function loadHole(n){
  if(hasLoadedOnce){
    await saveCurrentHole();
  }
  hasLoadedOnce = true;
  current = n;
  const h = HOLES.find(x=>x.n===n);
  updateRailActive();
  document.getElementById('holeNum').textContent = h.n;
  document.getElementById('badgePar').textContent = 'PAR ' + h.par;
  document.getElementById('badgeFB').textContent = 'FB ' + h.fb + 'Y';
  document.getElementById('badgeB').textContent = 'B ' + h.b + 'Y';

  undoStack = [];
  selectedShapeId = null;
  document.getElementById('notes').value = '';
  document.getElementById('saveState').textContent = '';

  let restoredNotes = '';
  shapes = [];
  legacyImage = null;
  legacyImageEl = null; legacyImageSrc = null;
  try{
    const res = await Store.get(`hole-${n}`);
    if(res && res.value){
      const data = JSON.parse(res.value);
      restoredNotes = data.notes || '';
      if(Array.isArray(data.shapes)){
        shapes = data.shapes;
        legacyImage = data.legacyImage || null;
      } else if(data.sketch){
        // Pre-upgrade save: the whole hand-drawn picture was one flattened
        // image. Keep it visible as a frozen background; only shapes
        // drawn from now on are individually selectable/editable.
        legacyImage = data.sketch;
      }
    }
  }catch(e){}

  document.getElementById('notes').value = restoredNotes;

  prepareCanvasForHole(h, (img) => {
    baseIllustrationImg = img;
    renderCanvasFull();
  });
}

document.getElementById('prevHole').addEventListener('click', ()=>{
  const idx = HOLES.findIndex(h=>h.n===current);
  const prev = HOLES[(idx - 1 + 18) % 18];
  loadHole(prev.n);
});
document.getElementById('nextHole').addEventListener('click', ()=>{
  const idx = HOLES.findIndex(h=>h.n===current);
  const next = HOLES[(idx + 1) % 18];
  loadHole(next.n);
});

// Swipe left/right on the page (outside the drawing canvas) to move between holes.
(function(){
  let startX = 0, startY = 0, startTarget = null;
  document.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    startTarget = e.target;
  }, {passive:true});
  document.addEventListener('touchend', (e)=>{
    if(!startTarget) return;
    if(drawModeOn && startTarget.closest && startTarget.closest('#sketch')){ startTarget = null; return; }
    if(!e.changedTouches || e.changedTouches.length !== 1) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startTarget = null;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0){ document.getElementById('nextHole').click(); }
      else { document.getElementById('prevHole').click(); }
    }
  }, {passive:true});
})();

function renderHoleCard(h, imgMap, missingLabel, rotate, notesMap){
  if(!h){
    return `<div class="hole-card hole-card-blank"></div>`;
  }
  let photo;
  if(imgMap[h.n]){
    photo = `<img src="${imgMap[h.n]}">`;
  } else if(missingLabel){
    photo = `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:6.5pt;color:#999;text-align:center;">${missingLabel}</div>`;
  } else {
    photo = svgMarkup(h);
  }
  const memo = (notesMap && notesMap[h.n]) ? notesMap[h.n] : '';
  return `
    <div class="hole-card${rotate ? ' hole-card-rotated' : ''}">
      <div class="hc-head">
        <span class="hc-num">${h.n}</span>
        <span class="hc-badges">PAR${h.par}・HDCP${h.hdcp}</span>
      </div>
      <div class="hc-photo">${photo}</div>
      <div class="hc-memo">${memo ? memo.replace(/</g,'&lt;') : ''}</div>
      <div class="hc-yard">FB ${h.fb}Y ／ B ${h.b}Y</div>
      <div class="hc-note">${h.note || ''}</div>
    </div>
  `;
}

function loadImageAsync(src){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

// Rasterizes one hole's illustration + editable shapes into a single
// image for printing, since a printed card needs one flat picture.
async function renderHoleToDataURL(h, holeShapes, holeLegacyImage){
  let w = canvas.width || 520, hh = canvas.height || 560;
  let baseImg = null;
  const illustSrc = HOLE_IMG[h.n];
  if(illustSrc){
    try{
      baseImg = await loadImageAsync(illustSrc);
      let iw = baseImg.naturalWidth || baseImg.width, ih = baseImg.naturalHeight || baseImg.height;
      const maxDim = Math.max(iw, ih);
      if(maxDim > MAX_CANVAS_DIM){
        const scale = MAX_CANVAS_DIM / maxDim;
        iw = Math.round(iw * scale); ih = Math.round(ih * scale);
      }
      w = iw; hh = ih;
    }catch(e){}
  }
  const off = document.createElement('canvas');
  off.width = w; off.height = hh;
  const octx = off.getContext('2d');
  octx.fillStyle = '#FBF7EC';
  octx.fillRect(0, 0, w, hh);
  if(holeLegacyImage){
    try{
      const limg = await loadImageAsync(holeLegacyImage);
      octx.drawImage(limg, 0, 0, w, hh);
    }catch(e){}
  } else if(baseImg){
    octx.drawImage(baseImg, 0, 0, w, hh);
  }
  for(const s of (holeShapes || [])){
    paintShape(octx, s);
  }
  return off.toDataURL('image/png');
}

async function getEffectiveData(baseMap){
  const images = Object.assign({}, baseMap);
  const notes = {};
  for(const h of HOLES){
    try{
      const res = await Store.get(`hole-${h.n}`);
      if(res && res.value){
        const data = JSON.parse(res.value);
        if(data.notes) notes[h.n] = data.notes;
        if(Array.isArray(data.shapes) && (data.shapes.length || data.legacyImage)){
          images[h.n] = await renderHoleToDataURL(h, data.shapes, data.legacyImage || null);
        } else if(data.sketch){
          images[h.n] = data.sketch;
        }
      }
    }catch(e){}
  }
  return {images, notes};
}

// Exact front/back page layout for double-sided printing, flip on short edge.
// Cutting the sheets gives 9 two-sided cards that flip in sequence
// (1<->2, 3<->4, ... 17<->18). Back-side cards are rotated 180 degrees.
function holeByNum(n){ return HOLES.find(h => h.n === n) || null; }

function buildDuplexPages(){
  const spec = [
    { nums: [1, 3, 5, 7, 9, 11],  rotate: false },
    { nums: [6, 4, 2, 12, 10, 8], rotate: true  },
    { nums: [13, 15, 17],        rotate: false },
    { nums: [18, 16, 14],        rotate: true  },
  ];
  return spec.map(p => ({
    cards: [...p.nums.map(holeByNum), ...new Array(6 - p.nums.length).fill(null)],
    rotate: p.rotate
  }));
}

async function buildAndPrintDuplex(imgMap, missingLabel, useAnnotations){
  await saveCurrentHole();
  let notesMap = {};
  if(useAnnotations){
    const merged = await getEffectiveData(imgMap);
    imgMap = merged.images;
    notesMap = merged.notes;
  }
  const root = document.getElementById('printRoot');
  const pages = buildDuplexPages();
  let sheetsHtml = '';
  for(const page of pages){
    const cardsHtml = page.cards.map(h => renderHoleCard(h, imgMap, missingLabel, page.rotate, notesMap)).join('');
    sheetsHtml += `<div class="a4-sheet">${cardsHtml}</div>`;
  }
  root.innerHTML = sheetsHtml;
  setTimeout(()=>{ window.print(); }, 60);
}
document.getElementById('printBtn').addEventListener('click', ()=> buildAndPrintDuplex(HOLE_IMG, null, true));

async function exportAllData(){
  await saveCurrentHole();
  const out = {};
  for(const h of HOLES){
    try{
      const res = await Store.get(`hole-${h.n}`);
      if(res && res.value) out[h.n] = res.value;
    }catch(e){}
  }
  const blob = new Blob([JSON.stringify(out)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'checkmate_yardage_notes.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
document.getElementById('btnExport').addEventListener('click', exportAllData);

async function resetAllToIllustration(){
  if(!confirm('全ホールの書き込み（絵）を消去して、元のイラストに戻します。メモの文章は残ります。よろしいですか？')) return;
  for(const h of HOLES){
    try{
      const res = await Store.get(`hole-${h.n}`);
      let notes = '';
      if(res && res.value){
        const data = JSON.parse(res.value);
        notes = data.notes || '';
      }
      await Store.set(`hole-${h.n}`, JSON.stringify({notes, shapes: [], legacyImage: null}));
    }catch(e){}
  }
  await loadHole(current);
  alert('全ホールをイラストに戻しました。');
}

document.getElementById('btnImportTrigger').addEventListener('click', ()=>{
  document.getElementById('btnImport').click();
});
document.getElementById('btnImport').addEventListener('change', (e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      for(const n of Object.keys(data)){
        await Store.set(`hole-${n}`, data[n]);
      }
      await loadHole(current);
      alert('読み込みが完了しました。');
    }catch(err){
      alert('ファイルの読み込みに失敗しました。');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});
